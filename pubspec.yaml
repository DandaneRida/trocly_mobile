name: trocly_mobile
description: "A peer-to-peer exchange (Trocly) mobile app for trading items."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6 # Route management
  http: ^1.1.0 # API calls
  shared_preferences: ^2.2.2 # Local storage
  flutter_secure_storage: ^9.0.0 # Secure token storage
  mobile_scanner: ^3.4.0 # QR code scanner (key feature)
  qr_flutter: ^4.1.0 # QR code generation
  intl: ^0.19.0 # Date formatting
  connectivity_plus: ^5.0.0 # Check network
  image_picker: ^1.0.2 # Pick images from gallery/camera
  firebase_core: ^2.24.0 # Firebase
  firebase_messaging: ^14.6.0 # Push notifications
  web_socket_channel: ^2.4.0 # WebSocket for real-time chat

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
