name: Trocly Mobile CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test test/trocly_test.dart

      - name: Build Release APK (connected to Live Cloud API)
        run: flutter build apk --release --dart-define=API_URL=https://teriyaki-functional-whale.abasthan.app

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trocly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
